<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Præstegården</title>
	<link rel="stylesheet" type="text/css" href="bower_components/bootstrap/dist/css/bootstrap.min.css">
	<!--[if IE]>
	    <link href="/stylesheets/ie.css" media="screen, projection" rel="stylesheet" type="text/css" />
	<![endif]-->
</head>
<style>
	.display {
		display: block;
		width: 100%;
	}

	.photo-frame {
		position: relative;
		aspect-ratio: 16 / 9;
		overflow: hidden;
	}

	.photo-frame .display {
		height: 100%;
		object-fit: cover;
		object-position: center;
	}
	.room-header,
	.description {
		text-align: center;
	}

	.photo-row {
		position: relative;
	}

	.photo-column {
		position: relative;
	}

	.navigation-column .arrow {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		background-color: rgba(0, 0, 0, 0.65);
		border-color: rgba(0, 0, 0, 0.8);
		color: #fff;
		font-size: 24px;
	}

	.navigation-column .arrow:hover,
	.navigation-column .arrow:focus {
		background-color: rgba(0, 0, 0, 0.85);
		border-color: #000;
		color: #fff;
	}

	.caption-box {
		position: absolute;
		bottom: max(0px, calc(100% - 100vh));
		left: 0;
		right: 0;
		padding: 10px 20px;
		background-color: rgba(0, 0, 0, 0.65);
		color: #fff;
		text-align: center;
		z-index: 1;
	}

	.caption-box .room-header,
	.caption-box .description {
		margin: 0;
	}

	.caption-box .description {
		margin-top: 5px;
	}

	@media (min-width: 768px) {
		html,
		body {
			overflow: hidden;
		}

		.photo-column {
			width: 100%;
			margin-left: 0;
			padding-left: 0;
			padding-right: 0;
		}

		.navigation-column {
			position: absolute;
			top: 50%;
			width: 62px;
			height: 62px;
			margin-left: 0;
			padding-left: 0;
			padding-right: 0;
			transform: translateY(-50%);
			z-index: 1;
		}

		.navigation-column.left-navigation {
			left: 0;
		}

		.navigation-column.right-navigation {
			right: 0;
		}

		.navigation-column.forward-navigation {
			top: 0;
			left: 50%;
			transform: translateX(-50%);
		}
	}

	@media (max-width: 767px) {
		.photo-column {
			width: 100%;
			margin-left: 0;
			padding-left: 0;
			padding-right: 0;
		}

		.navigation-column {
			position: absolute;
			top: 50%;
			width: 62px;
			height: 62px;
			margin-left: 0;
			padding-left: 0;
			padding-right: 0;
			transform: translateY(-50%);
			z-index: 1;
		}

		.navigation-column.left-navigation {
			left: 0;
		}

		.navigation-column.right-navigation {
			right: 0;
		}

		.navigation-column.forward-navigation {
			top: 0;
			left: 50%;
			transform: translateX(-50%);
		}

		.display {
			height: 100%;
			object-fit: cover;
			object-position: center;
		}

		.photo-frame {
			aspect-ratio: 9 / 16;
			overflow: hidden;
		}

		.photo-frame .display {
			height: 100%;
		}
	}

</style>
<body>
	<div class="container-fluid">
		<div class="row photo-row">

			<div class="col-xs-2 col-xs-offset-1 navigation-column left-navigation">
				<a class="arrow left btn btn-info btn-sm center-block " data-direction=-1 href="/left">&larr;</a>


			</div>


			<div class="col-xs-6 photo-column">
				<div class="navigation-column forward-navigation">
					<a class="arrow forward btn btn-info btn-sm center-block" data-direction=0 href="/link">&uarr;</a>
				</div>
				<div class="photo-frame">
					<img class="display img-fluid" src="images/IMG_5560.JPG">
					<div class="caption-box">
						<h2 class="room-header">
							For-entréen
						</h2>
						<p class="description">Blik ind gennem entréen til karnapstuen</p>
					</div>
				</div>





			</div>
			<div class="col-xs-2 navigation-column right-navigation">
				<a class="arrow right btn btn-info btn-sm center-block"data-direction=1 href="/right">&rarr;</a>
			</div>
			
		</div>


	</div>


	<script src="bower_components/jquery/dist/jquery.min.js"></script>
	<script src="bower_components/bootstrap/dist/js/bootstrap.min.js"></script>
	<script src="js/jquery-ui.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
